# Servidor de mídia: Jellyfin + *arr + qBittorrent + Homepage
# Uso: cp .env.example .env && editar .env && docker compose up -d   (ou podman compose up -d)
# Todos os serviços ficam na mesma rede, então se falam pelo nome do serviço (ex.: qbittorrent:8080).

x-arr: &arr
  restart: unless-stopped
  environment: &arr-env
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-America/Sao_Paulo}

services:
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    restart: unless-stopped
    ports: ["8096:8096"]
    devices: ["/dev/dri:/dev/dri"]        # aceleração Intel QSV/VAAPI; remova se não houver GPU
    group_add: ["${RENDER_GID:-105}"]     # getent group render | cut -d: -f3
    volumes:
      - ${DATA}/jellyfin/config:/config
      - ${DATA}/jellyfin/cache:/cache
      - ${MEDIA}:/media

  qbittorrent:
    <<: *arr
    image: lscr.io/linuxserver/qbittorrent:latest
    environment: {<<: *arr-env, WEBUI_PORT: "8080"}
    ports: ["8081:8080", "6881:6881", "6881:6881/udp"]
    volumes: ["${DATA}/qbittorrent:/config", "${MEDIA}:/media"]

  prowlarr:
    <<: *arr
    image: lscr.io/linuxserver/prowlarr:latest
    ports: ["9696:9696"]
    volumes: ["${DATA}/prowlarr:/config"]

  radarr:
    <<: *arr
    image: lscr.io/linuxserver/radarr:latest
    ports: ["7878:7878"]
    volumes: ["${DATA}/radarr:/config", "${MEDIA}:/media"]

  sonarr:
    <<: *arr
    image: lscr.io/linuxserver/sonarr:latest
    ports: ["8989:8989"]
    volumes: ["${DATA}/sonarr:/config", "${MEDIA}:/media"]

  bazarr:
    <<: *arr
    image: lscr.io/linuxserver/bazarr:latest
    ports: ["6767:6767"]
    volumes: ["${DATA}/bazarr:/config", "${MEDIA}:/media"]

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    shm_size: 256m                        # sem porta publicada; o Prowlarr usa http://flaresolverr:8191

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_VAR_HOST: ${HOST}          # usado nos links de templates/homepage/services.yaml
    ports: ["8082:3000"]
    volumes: ["${DATA}/homepage:/app/config"]
